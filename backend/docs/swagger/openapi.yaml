security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      description: 1-indexed page number
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      description: Items per page (max 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchParam:
      name: search
      in: query
      description: Substring search
      schema: { type: string }
    StatusParam:
      name: status
      in: query
      description: Filter by status
      schema: { type: string }
    StateParam:
      name: state
      in: query
      schema: { type: string }
    LgaParam:
      name: lga
      in: query
      schema: { type: string }
    CropParam:
      name: crop
      in: query
      schema: { type: string }
    TierParam:
      name: tier
      in: query
      schema: { type: string, enum: [A, B, C, D] }
    StartDateParam:
      name: startDate
      in: query
      schema: { type: string, format: date }
    EndDateParam:
      name: endDate
      in: query
      schema: { type: string, format: date }
  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but lacks required role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Validation:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

paths: {}
