openapi: 3.0.3
info:
  title: Heabron CoopScore API
  description: |
    REST API for the Heabron CoopScore platform.

    ### Audiences
    - **Field Agent app** — consumes the `/api/agent/*` endpoints (login, KYC, cooperatives, farmers, deliveries, financing, repayments, wallet).
    - **Admin web** — consumes the `/api/admin/*` endpoints for governance, approvals, partner management, and credit oversight.
    - **Partner portal** — consumes the `/api/partner/*` endpoints (lender/investor credit reports, portfolio monitoring, financing decisions).

    ### Authentication
    All endpoints (except `/api/auth/*` and `/api/health`) require a **Bearer JWT** in the `Authorization` header:
    ```
    Authorization: Bearer <accessToken>
    ```
    Tokens are obtained via `POST /api/auth/login` and refreshed via `POST /api/auth/refresh`.

    ### Response envelope
    Every endpoint returns either:
    ```json
    { "success": true, "data": <any>, "meta": <pagination>? }
    ```
    or:
    ```json
    { "success": false, "error": { "code": "...", "message": "...", "details": <any>? } }
    ```

    ### Error codes
    | Code | HTTP |
    |---|---|
    | `BAD_REQUEST` | 400 |
    | `UNAUTHORIZED` | 401 |
    | `FORBIDDEN` | 403 |
    | `NOT_FOUND` | 404 |
    | `CONFLICT` | 409 |
    | `UNPROCESSABLE_ENTITY` | 422 |
    | `TOO_MANY_REQUESTS` | 429 |
    | `INTERNAL_ERROR` | 500 |
  version: 1.0.0
  contact:
    name: Heabron Farm Limited
    email: info@heabron.com
    url: https://www.heabron.com

