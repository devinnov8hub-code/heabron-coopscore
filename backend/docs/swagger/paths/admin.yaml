      - $ref: '#/components/parameters/PageSizeParam'
    responses:
      '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } } }

/admin/credit/farmers/{farmerId}:
  parameters:
    - name: farmerId
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    tags: [Admin — Credit]
    summary: Get a farmer's current score plus history
