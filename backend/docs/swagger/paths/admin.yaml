      '200': { description: Recalculated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

/admin/credit/farmers/{farmerId}/report:
  parameters:
    - name: farmerId
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    tags: [Admin — Credit]
    summary: Generate a full credit report for one farmer
    responses:
      '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

/admin/credit/cooperatives:
  get:
    tags: [Admin — Credit]
    summary: List cooperative credit scores
    parameters:
      - $ref: '#/components/parameters/TierParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
    responses:
      '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } } }

/admin/credit/cooperatives/{cooperativeId}:
  parameters:
    - name: cooperativeId
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    tags: [Admin — Credit]
    summary: Get a cooperative score with members
    responses:
      '200': { description: Score, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

/admin/credit/cooperatives/{cooperativeId}/recalculate:
  parameters:
    - name: cooperativeId
      in: path
      required: true
      schema: { type: string, format: uuid }
  post:
    tags: [Admin — Credit]
    summary: Recalculate a cooperative's aggregate score
    responses:
      '200': { description: Recalculated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

/admin/credit/cooperatives/{cooperativeId}/report:
  parameters:
    - name: cooperativeId
      in: path
      required: true
      schema: { type: string, format: uuid }
  get:
    tags: [Admin — Credit]
    summary: Generate a full credit report for a cooperative
    responses:
      '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

/admin/benchmarks:
  get:
    tags: [Admin — Benchmarks]
    summary: List regional yield benchmarks
    parameters:
      - $ref: '#/components/parameters/CropParam'
      - $ref: '#/components/parameters/StateParam'
      - $ref: '#/components/parameters/LgaParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
    responses:
      '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } } }
  post:
    tags: [Admin — Benchmarks]
    summary: Upsert a benchmark (crop × state × lga? × season?)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [crop, state, benchmarkYieldTonnesPerHectare]
            properties:
              crop: { type: string }
              state: { type: string }
              lga: { type: string }
              season: { type: string }
              benchmarkYieldTonnesPerHectare: { type: number }
              source: { type: string }
    responses:
      '201': { description: Upserted, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

/admin/wallets:
  get:
    tags: [Admin — Wallets]
    summary: List all agent wallets ranked by balance
    parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
    responses:
      '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } } }

/admin/settlements:
  get:
    tags: [Admin — Wallets]
    summary: List settlement requests
    parameters:
      - $ref: '#/components/parameters/StatusParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
    responses:
      '200':
        description: Page of settlements
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PaginatedEnvelope'
                - properties: { data: { type: array, items: { $ref: '#/components/schemas/SettlementRequest' } } }

/admin/settlements/{settlementId}/decision:
  parameters:
    - name: settlementId
      in: path
      required: true
      schema: { type: string, format: uuid }
  post:
    tags: [Admin — Wallets]
    summary: Approve or reject a settlement request
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision: { type: string, enum: [approve, reject] }
              adminNotes: { type: string }
    responses:
      '200': { description: Decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

/admin/activity-logs:
  get:
    tags: [Admin — Activity]
    summary: List system activity log entries
    parameters:
      - { name: actorId, in: query, schema: { type: string, format: uuid } }
      - { name: action, in: query, schema: { type: string } }
      - { name: entityType, in: query, schema: { type: string } }
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
    responses:
      '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } } }
